  "/api/v1/transactions/{transaction_id}/attachments":
    parameters:
    - name: transaction_id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    post:
      summary: Attach a file to a transaction
      description: 'Uploads a receipt or other file, with the same rules as the web:
        JPEG, PNG, GIF, WebP or PDF (image/jpeg, image/jpg, image/png, image/gif,
        image/webp, application/pdf), at most 10 MB, and at most 10 files per transaction.
        The type is detected from the file content, so HEIC photos are rejected; convert
        them to JPEG first. Needs owner, full_control or read_write access to the
        account.'
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: attachment stored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionAttachment"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: API key without write scope, or a read_only share
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: transaction not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: disallowed type, too large, too many attachments, or no file
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
        required: true
        description: The file to attach
  "/api/v1/transactions/{transaction_id}/attachments/{id}":
    parameters:
    - name: transaction_id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    delete:
      summary: Delete an attachment
      description: Deletes the file. Needs owner or full_control access to the account;
        a read_write share can add files but not delete them, as on the web.
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      responses:
        '204':
          description: attachment deleted
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: attachment not found on this transaction
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/attachments/{id}":
