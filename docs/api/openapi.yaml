    get:
      summary: Show LLM usage and estimated cost
      tags:
      - Settings
      security:
      - apiKeyAuth: []
      description: |
        Settings → LLM usage's totals for the range, plus per model and per day (the family's time zone).
        Defaults to the 30 days before `end_date`, which defaults to today. Family admins only, as the web page is; members and guests get 403 `forbidden`.
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: usage
          content:
            application/json:
              schema:
                type: object
                required:
                - llm_usage
                properties:
                  llm_usage:
                    type: object
                    properties:
                      start_date:
                        type: string
                        format: date
                      end_date:
                        type: string
                        format: date
                      currency:
                        type: string
                        enum:
                        - USD
                      total_requests:
                        type: integer
                      requests_with_cost:
                        type: integer
                        description: Requests with a known price; costs only count
                          these
                      total_prompt_tokens:
                        type: integer
                      total_completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
                      total_cost:
                        type: string
                        description: Total, formatted in USD as the web page shows
                          it
                      total_cost_cents:
                        type: integer
                        description: Rounded to whole cents
                      total_cost_amount:
                        type: string
                        description: Unrounded decimal USD; most single requests cost
                          under a cent
                      avg_cost:
                        type: string
                        description: Average per priced request, formatted in USD
                          as the web page shows it
                      avg_cost_cents:
                        type: integer
                        description: Rounded to whole cents
                      avg_cost_amount:
                        type: string
                        description: Unrounded decimal USD; most single requests cost
                          under a cent
                      by_operation:
                        type: array
                        items:
                          type: object
                          properties:
                            operation:
                              type: string
                            label:
                              type: string
                            cost:
                              type: string
                              description: Cost, formatted in USD as the web page
                                shows it
                            cost_cents:
                              type: integer
                              description: Rounded to whole cents
                            cost_amount:
                              type: string
                              description: Unrounded decimal USD; most single requests
                                cost under a cent
                      by_model:
                        type: array
                        items:
                          type: object
                          properties:
                            model:
                              type: string
                            total_requests:
                              type: integer
                            requests_with_cost:
                              type: integer
                              description: Requests with a known price; costs only
                                count these
                            total_prompt_tokens:
                              type: integer
                            total_completion_tokens:
                              type: integer
                            total_tokens:
                              type: integer
                            cost:
                              type: string
                              description: Cost, formatted in USD as the web page
                                shows it
                            cost_cents:
                              type: integer
                              description: Rounded to whole cents
                            cost_amount:
                              type: string
                              description: Unrounded decimal USD; most single requests
                                cost under a cent
                      by_day:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            total_requests:
                              type: integer
                            requests_with_cost:
                              type: integer
                              description: Requests with a known price; costs only
                                count these
                            total_prompt_tokens:
                              type: integer
                            total_completion_tokens:
                              type: integer
                            total_tokens:
                              type: integer
                            cost:
                              type: string
                              description: Cost, formatted in USD as the web page
                                shows it
                            cost_cents:
                              type: integer
                              description: Rounded to whole cents
                            cost_amount:
                              type: string
                              description: Unrounded decimal USD; most single requests
                                cost under a cent
        '422':
          description: invalid date range
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/api_keys":
    get:
      summary: List API keys
      tags:
      - API Keys
      description: The signed-in user's active API keys, newest first. Keys are masked;
        the full key is only in the create response.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: API keys listed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - scopes
                      - display_key
                      - current
                      - created_at
                      - last_used_at
                      - expires_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                            enum:
                            - read
                            - read_write
                        display_key:
                          type: string
                          description: 'Masked key: asterisks and the last four characters'
                        current:
                          type: boolean
                          description: Whether this key authenticated the request
                        created_at:
                          type: string
                          format: date-time
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                        expires_at:
                          type: string
                          format: date-time
                          nullable: true
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Create an API key
      tags:
      - API Keys
      description: Creates a key for the signed-in user and returns it in full once,
        in plain_key. Needs read_write. Limited to 10 keys per user per hour.
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - name
                    - scopes
                    - display_key
                    - current
                    - created_at
                    - last_used_at
                    - expires_at
                    - plain_key
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      scopes:
                        type: array
                        items:
                          type: string
                          enum:
                          - read
                          - read_write
                      display_key:
                        type: string
                        description: 'Masked key: asterisks and the last four characters'
                      current:
                        type: boolean
                        description: Whether this key authenticated the request
                      created_at:
                        type: string
                        format: date-time
                      last_used_at:
                        type: string
                        format: date-time
                        nullable: true
                      expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      plain_key:
                        type: string
                        description: The full key, shown only here
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - api_key
              properties:
                api_key:
                  type: object
                  required:
                  - name
                  - scopes
                  properties:
                    name:
                      type: string
                      description: Unique among the user's active keys
                    scopes:
                      type: array
                      items:
                        type: string
                        enum:
                        - read
                        - read_write
                      description: Exactly one scope
  "/api/v1/api_keys/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: API key ID
      schema:
        type: string
    delete:
      summary: Revoke an API key
      tags:
      - API Keys
      description: Revokes one of the user's keys. The key authenticating the request
        cannot be revoked (422 cannot_revoke_current_key).
      security:
      - apiKeyAuth: []
      responses:
        '204':
          description: API key revoked
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: cannot revoke the current key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/auth/signup":
    post:
      summary: Sign up a new user
      tags:
      - Auth
      description: Creates a new user and family. The first user on a fresh instance
        is assigned the super_admin role; later family creators are assigned an admin
        role.
      parameters: []
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  created_at:
                    type: integer
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      ui_layout:
                        type: string
                        enum:
                        - dashboard
                        - intro
                      ai_enabled:
                        type: boolean
        '422':
          description: validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: 'registration refused: the instance is closed to new registrations,
            or an invite code is required or invalid'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '400':
          description: 'bad request: the user payload is missing, or device information
            is missing or invalid'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: User email address
                    password:
                      type: string
                      description: Password (min 8 chars, mixed case, number, special
                        char)
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - email
                  - password
                device:
                  type: object
                  properties:
                    device_id:
                      type: string
                      description: Unique device identifier
                    device_name:
                      type: string
                      description: Human-readable device name
                    device_type:
                      type: string
                      description: Device type (e.g. ios, android)
                    os_version:
                      type: string
                    app_version:
                      type: string
                  required:
                  - device_id
                  - device_name
                  - device_type
                  - os_version
                  - app_version
                invite_code:
                  type: string
                  nullable: true
                  description: Invite code (required when invites are enforced)
              required:
              - user
              - device
        required: true
  "/api/v1/auth/login":
    post:
      summary: Log in with email and password
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  created_at:
                    type: integer
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      ui_layout:
                        type: string
                        enum:
                        - dashboard
                        - intro
                      ai_enabled:
                        type: boolean
        '401':
          description: invalid credentials, MFA required, or account deactivated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: 'local login is disabled: the instance is SSO-only, and this
            account is not a super admin using the emergency override'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                otp_code:
                  type: string
                  nullable: true
                  description: TOTP code if MFA is enabled
                device:
                  type: object
                  properties:
                    device_id:
                      type: string
                    device_name:
                      type: string
                    device_type:
                      type: string
                    os_version:
                      type: string
                    app_version:
                      type: string
                  required:
                  - device_id
                  - device_name
                  - device_type
                  - os_version
                  - app_version
              required:
              - email
              - password
              - device
        required: true
  "/api/v1/auth/sso_providers":
    get:
      summary: List configured SSO providers
      tags:
      - Auth
      description: Lists the SSO providers configured on this instance. Each name
        can be used with GET /auth/mobile/{name} to start mobile SSO.
      responses:
        '200':
          description: providers listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Provider name used in /auth/mobile/{name}
                        strategy:
                          type: string
                          description: OmniAuth strategy, e.g. openid_connect, google_oauth2,
                            github, saml
                        label:
                          type: string
                          description: Button label
                      required:
                      - name
                      - strategy
                      - label
                required:
                - providers
  "/api/v1/auth/sso_exchange":
    post:
      summary: Exchange mobile SSO authorization code for tokens
      tags:
      - Auth
      description: Exchanges a one-time authorization code (received via deep link
        after mobile SSO) for OAuth tokens. The code is single-use and expires after
        5 minutes.
      parameters: []
      responses:
        '200':
          description: tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  created_at:
                    type: integer
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      ui_layout:
                        type: string
                        enum:
                        - dashboard
                        - intro
                      ai_enabled:
                        type: boolean
        '401':
          description: invalid or expired code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: One-time authorization code from mobile SSO callback
              required:
              - code
        required: true
  "/api/v1/auth/refresh":
    post:
      summary: Refresh an access token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  created_at:
                    type: integer
        '401':
          description: invalid or revoked refresh token, or account deactivated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '400':
          description: missing refresh token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token from a previous login or refresh
                device:
                  type: object
                  properties:
                    device_id:
                      type: string
                  required:
                  - device_id
              required:
              - refresh_token
              - device
        required: true
  "/api/v1/auth/sso_link":
    post:
      summary: Link an existing account via SSO
      tags:
      - Auth
      description: Authenticates with email/password and links the SSO identity from
        a previously issued linking code. Creates an OidcIdentity, logs the link via
        SsoAuditLog, and issues mobile OAuth tokens.
      parameters: []
      responses:
        '200':
          description: account linked and tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  created_at:
                    type: integer
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      ui_layout:
                        type: string
                        enum:
                        - dashboard
                        - intro
                      ai_enabled:
                        type: boolean
        '400':
          description: missing linking code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: invalid credentials, expired linking code, or account deactivated
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/MfaRequiredResponse"
        '403':
          description: SSO identity removed by an administrator
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
