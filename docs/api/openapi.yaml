    CashFlowSankey:
      type: object
      required:
      - basis
      - income
      - spending
      - net_savings
      - nodes
      - links
      description: Refunds net within each category. Parent direct amounts exclude
        child totals before partitioning by direction. Graph income/spending may differ
        from gross monthly totals; net savings agrees. Decimal strings retain FX precision.
        Empty flow has empty nodes and links.
      properties:
        basis:
          type: string
          enum:
          - net_by_category
          - net_by_account
          description: net_by_account (group_by=account) replaces the Cash Flow node
            with one account node per account, each balanced by Surplus or Deficit.
            Where an account in surplus paid one in deficit by confirmed transfer
            in the period, that amount is a link between the two account nodes instead
        income:
          type: string
        spending:
          type: string
        net_savings:
          type: string
        invested:
          type: string
          description: Money moved into investment accounts, shown as its own node.
            Zero unless the family does not count investing as spending
        nodes:
          type: array
          items:
            type: object
            required:
            - id
            - name
            - kind
            - value
            - percentage
            - category_id
            - filter_value
            - color
            properties:
              id:
                type: string
                description: Stable direction-prefixed category identifier or structural
                  identifier
              name:
                type: string
              kind:
                type: string
                enum:
                - income
                - expense
                - cash_flow
                - account
                - surplus
                - deficit
                - invested
              value:
                type: string
                description: Nonnegative decimal in envelope currency
              percentage:
                type: string
                description: Percentage of parent, or side total for root categories;
                  structural balancing nodes use central capacity
              category_id:
                type: string
                format: uuid
                nullable: true
              filter_value:
                type: string
                nullable: true
                description: Web transaction category filter; null means no category
                  drill-down
              color:
                type: string
                nullable: true
                description: User category color; structural colors belong to the
                  client
        links:
          type: array
          items:
            type: object
            required:
            - source
            - target
            - value
            - percentage
            properties:
              source:
                type: integer
                minimum: 0
                description: Zero-based nodes index
              target:
                type: integer
                minimum: 0
                description: Zero-based nodes index
              value:
                type: string
                description: Positive decimal in envelope currency
              percentage:
                type: string
    CashFlowGraph:
      type: object
      required:
      - as_of
      - time_zone
      - currency
      - period
      - sankey
      properties:
        as_of:
          type: string
          format: date
        time_zone:
          type: string
        currency:
          type: string
        period:
          "$ref": "#/components/schemas/FinancialPeriod"
        sankey:
          "$ref": "#/components/schemas/CashFlowSankey"
    SpendingVsNormalCategory:
      type: object
      required:
      - id
      - name
      - color
      - filter_value
      - total
      - normal
      - change
      - ratio
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Null for the synthetic Uncategorized category. A parent's own
            spending is listed among its subcategories with the parent's id
        name:
          type: string
        color:
          type: string
          nullable: true
        filter_value:
          type: string
          description: Value for the transactions category filter
        total:
          type: string
          description: Net spending in the period (expense minus refunds), at least
            zero
        normal:
          type: string
          nullable: true
          description: 'Finished period: net spending over the baseline period, scaled
            to the period length. Unfinished period (in_progress): average net spending
            over the same number of days from earlier month starts. Null without enough
            history'
        change:
          type: string
          nullable: true
          description: total minus normal
        ratio:
          type: string
          nullable: true
          description: Fractional change against normal (0.5 = 50% more). Null without
            a positive normal
        direct:
          type: boolean
          description: 'Present on subcategories only: true for the parent''s own
            spending, booked on the parent rather than a subcategory'
        subcategories:
          type: array
          items:
            "$ref": "#/components/schemas/SpendingVsNormalCategory"
          description: Present on parent categories only; adds up to the parent total
    SpendingVsNormal:
      type: object
      required:
      - currency
      - period
      - in_progress
      - baseline_period
      - comparable
      - total
      - normal_total
      - categories
      properties:
        currency:
          type: string
        period:
          "$ref": "#/components/schemas/FinancialPeriod"
        in_progress:
          type: boolean
          description: 'The period has not ended: it is cut to today, and normal is
            the average of the same number of days from each of up to 12 earlier month
            starts'
        baseline_period:
          type: object
          nullable: true
          required:
          - start_date
          - end_date
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
          description: Up to a year before the period, from the first counted transaction.
            Null with under 28 days of history
        comparable:
          type: boolean
        total:
          type: string
        normal_total:
          type: string
          nullable: true
        categories:
          type: array
          items:
            "$ref": "#/components/schemas/SpendingVsNormalCategory"
          description: Parent categories, largest total first
