  "/api/v1/provider_connections/{id}/complete_setup":
    parameters:
    - name: id
      in: path
      required: true
      description: Provider connection ID
      schema:
        type: string
    - name: provider
      in: query
      required: false
      description: The connection's provider key from the list. Needed only when two
        connections share an id.
      schema:
        type: string
    post:
      summary: Creates Sure accounts for a connection's pending accounts
      description: 'Runs the web''s complete_account_setup: each account with import
        true becomes a Sure account of the chosen type and subtype, and a sync is
        queued. import false skips it; accounts left out stay pending. accountable_type
        and subtype must come from that account''s allowed_types; providers with one
        fixed type (Kraken, Binance, CoinSpot, IBKR) need neither. sync_start_date
        is accepted for SimpleFIN and Binance, whose web setup step sets it. The whole
        request is checked first, so a 422 changes nothing. Family admins only.'
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: accounts created and a sync queued
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ProviderConnection"
                - type: object
                  required:
                  - setup_required
                  - awaiting_accounts
                  - pending_accounts
                  properties:
                    setup_required:
                      type: boolean
                      description: Accounts are waiting for setup, or will be once
                        the first sync finds them
                    awaiting_accounts:
                      type: boolean
                      description: The first sync hasn't found any accounts yet; poll
                        pending_accounts
                    pending_accounts:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - name
                        - balance
                        - balance_cents
                        - currency
                        - allowed_types
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: Provider account ID; send it back in complete_setup
                          name:
                            type: string
                          institution:
                            type: string
                            nullable: true
                          balance:
                            type: string
                            description: Formatted balance as the provider reports
                              it
                          balance_cents:
                            type: integer
                          currency:
                            type: string
                          suggested_accountable_type:
                            type: string
                            nullable: true
                            description: What the web form preselects; null means
                              it preselects Skip
                          suggested_subtype:
                            type: string
                            nullable: true
                          allowed_types:
                            type: array
                            description: The types the web setup form offers for this
                              provider, with their subtypes
                            items:
                              type: object
                              required:
                              - accountable_type
                              - label
                              - subtypes
                              properties:
                                accountable_type:
                                  type: string
                                  example: Depository
                                label:
                                  type: string
                                subtypes:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - value
                                    - label
                                    properties:
                                      value:
                                        type: string
                                      label:
                                        type: string
                    created_account_ids:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Only on complete_setup
        '422':
          description: invalid_account_type, invalid_subtype, unknown_account, link_not_supported,
            invalid_sync_start_date or validation_failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - accounts
              properties:
                sync_start_date:
                  type: string
                  format: date
                accounts:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        format: uuid
                      import:
                        type: boolean
                        default: true
                      accountable_type:
                        type: string
                        example: Depository
                      subtype:
                        type: string
                        nullable: true
                        example: checking
        required: true
