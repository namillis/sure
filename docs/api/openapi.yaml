  "/api/v1/goals/summary":
    get:
      summary: Goals summary
      tags:
      - Goals
      description: The figures the web goals index shows in its KPI header, over active
        and paused goals (completed and archived are left out), plus the Plan hub's
        saved and target totals. velocity_* is the net inflow into goal-linked accounts
        over the last 30 days and the 30 days before, signed. on_track_count is out
        of tracked_total, which leaves out paused, reached, reserve and no-target-date
        goals. saved and target only include goals in the family currency.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: summary
          content:
            application/json:
              schema:
                type: object
                required:
                - currency
                - velocity_30d
                - velocity_30d_cents
                - needs_this_month
                - needs_this_month_cents
                - on_track_count
                - tracked_total
                - active_total
                - saved
                - saved_cents
                - target
                - target_cents
                properties:
                  currency:
                    type: string
                  velocity_30d:
                    type: string
                    nullable: true
                    description: Contributed in the last 30 days (net inflow; negative
                      for a net outflow)
                  velocity_30d_cents:
                    type: integer
                    nullable: true
                  velocity_prior_30d:
                    type: string
                    nullable: true
                    description: The same figure for the 30 days before
                  velocity_prior_30d_cents:
                    type: integer
                    nullable: true
                  velocity_delta_percent:
                    type: number
                    nullable: true
                    description: Change against the prior 30 days; null when that
                      was zero
                  velocity_direction:
                    type: string
                    enum:
                    - up
                    - down
                    - flat
                  needs_this_month:
                    type: string
                    nullable: true
                    description: Sum of the monthly target of goals behind pace
                  needs_this_month_cents:
                    type: integer
                    nullable: true
                  on_track_count:
                    type: integer
                  tracked_total:
                    type: integer
                    description: Goals with a pace to compare against
                  reached_count:
                    type: integer
                  behind_count:
                    type: integer
                  no_date_count:
                    type: integer
                  paused_count:
                    type: integer
                  pace_unknown_count:
                    type: integer
                    description: Goals whose accounts give no measurable pace
                  active_total:
                    type: integer
                    description: Active and paused goals
                  saved:
                    type: string
                    nullable: true
                    description: Total held for the goals
                  saved_cents:
                    type: integer
                    nullable: true
                  target:
                    type: string
                    nullable: true
                    description: Total of the goals' targets
                  target_cents:
                    type: integer
                    nullable: true
                  pending_pledges_count:
                    type: integer
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: preview features disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
