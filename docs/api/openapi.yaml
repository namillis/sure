    FinancekitBatch:
      type: object
      additionalProperties: false
      required:
      - protocol_version
      - connection_id
      - publisher_id
      - generation
      - stream_id
      - batch_id
      - sequence
      - capture_id
      - chunk_index
      - chunk_count
      - capture_mode
      - snapshot_complete
      - captured_at
      - selected_source_account_ids
      - events
      properties:
        protocol_version:
          type: integer
          enum:
          - 2
        connection_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        publisher_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        generation:
          type: integer
          minimum: 1
        stream_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        batch_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        sequence:
          type: integer
          minimum: 1
        predecessor_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        capture_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        chunk_index:
          type: integer
          minimum: 0
        chunk_count:
          type: integer
          minimum: 1
          maximum: 100
        capture_mode:
          type: string
          enum:
          - snapshot
          - delta
        snapshot_complete:
          type: boolean
        captured_at:
          type: string
          format: date-time
        selected_source_account_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
            pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        events:
          type: array
          maxItems: 500
          items:
            "$ref": "#/components/schemas/FinancekitEvent"
      description: Immutable ordered publisher batch. sequence 1 omits predecessor_digest;
        later batches carry the SHA-256 digest of the preceding payload. Omission
        never deletes data.
    FinancekitBatchReceipt:
      type: object
      additionalProperties: false
      required:
      - connection_id
      - publisher_id
      - generation
      - stream_id
      - batch_id
      - sequence
      - payload_digest
      - status
      - accepted_at
      - applied_at
      - error_code
      properties:
        connection_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        publisher_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        generation:
          type: integer
        stream_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        batch_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        sequence:
          type: integer
        payload_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          type: string
          enum:
          - accepted
          - processing
          - applied
          - failed
          - revoked
        accepted_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          type: string
          nullable: true
    FinancekitConflict:
      type: object
      required:
      - id
      - kind
      - status
      - details
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
        kind:
          type: string
        status:
          type: string
          enum:
          - open
          - resolved
        details:
          type: object
        resolution:
          type: string
          nullable: true
        resolved_at:
          allOf:
          - type: string
            format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        financekit_account_lineage_id:
          allOf:
          - type: string
            format: uuid
            pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
          nullable: true
        financekit_transaction_id:
          allOf:
          - type: string
            format: uuid
            pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
          nullable: true
    FinancekitConflictResolution:
      type: object
      additionalProperties: false
      required:
      - resolution
      properties:
        resolution:
          type: string
          description: "`keep_sure` closes the conflict without mutating the publisher
            stream. `retry_after_repair` closes the conflict, moves the connection
            to repair_required, revokes queued work and credentials, and requires
            POST /repair before uploads resume."
          enum:
          - keep_sure
          - retry_after_repair
    FinancekitCapabilities:
      type: object
      additionalProperties: false
      required:
      - available
      - protocol_versions
      - delivery
      - max_payload_bytes
      - max_records
      - max_accounts
      - max_queued_batches
      - transaction_statuses
      - amount_precision
      - amount_scale
      - connection_dispositions
      properties:
        available:
          type: boolean
        protocol_versions:
          type: array
          items:
            type: integer
            enum:
            - 2
        delivery:
          type: string
          enum:
          - background_publisher
        max_payload_bytes:
          type: integer
        max_records:
          type: integer
        max_accounts:
          type: integer
        max_queued_batches:
          type: integer
        transaction_statuses:
          type: array
          items:
            type: string
        amount_precision:
          type: integer
        amount_scale:
          type: integer
        connection_dispositions:
          type: array
          items:
            type: string
            enum:
            - retain
            - discard
    FinancekitError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
paths:
  "/api/v1/accounts/{id}/sharing":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show who an account is shared with
      description: Sure+ `accounts.sharing`. The web's sharing dialog. The owner gets
        every active family member with a permission (`none` means not shared); a
        member the account is shared with gets their own permission and `include_in_finances`.
      tags:
      - Account Sharing (Sure+)
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: sharing shown
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - is_owner
                - owner
                - permission
                - include_in_finances
                - permissions
                - members
                properties:
                  account_id:
                    type: string
                    format: uuid
                  is_owner:
                    type: boolean
                  owner:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  permission:
                    type: string
                    nullable: true
                    enum:
                    - full_control
                    - read_write
                    - read_only
                    -
                    description: The caller's own share permission; null for the owner.
                  include_in_finances:
                    type: boolean
                    nullable: true
                    description: Whether the account counts in the caller's finances;
                      null for the owner.
                  permissions:
                    type: array
                    items:
                      type: string
                  members:
                    type: array
                    description: Owner only; empty for anyone else.
                    items:
                      type: object
                      required:
                      - user_id
                      - name
                      - permission
                      properties:
                        user_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        permission:
                          type: string
                          enum:
                          - none
                          - full_control
                          - read_write
                          - read_only
        '404':
          description: account not accessible
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Change who an account is shared with
      description: 'Sure+ `accounts.sharing`. Owner: `members` with a permission each
        (`none` unshares; new shares count in the member''s finances, as on the web).
        Members not listed are left alone. A member the account is shared with may
        only send `include_in_finances`; sending `members` is 403. Unknown permissions
        or users are 422.'
      tags:
      - Account Sharing (Sure+)
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: sharing updated
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - is_owner
                - owner
                - permission
                - include_in_finances
                - permissions
                - members
                properties:
                  account_id:
                    type: string
                    format: uuid
                  is_owner:
                    type: boolean
                  owner:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  permission:
                    type: string
                    nullable: true
                    enum:
                    - full_control
                    - read_write
                    - read_only
                    -
                    description: The caller's own share permission; null for the owner.
                  include_in_finances:
                    type: boolean
                    nullable: true
                    description: Whether the account counts in the caller's finances;
                      null for the owner.
                  permissions:
                    type: array
                    items:
                      type: string
                  members:
                    type: array
                    description: Owner only; empty for anyone else.
                    items:
                      type: object
                      required:
                      - user_id
                      - name
                      - permission
                      properties:
                        user_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        permission:
                          type: string
                          enum:
                          - none
                          - full_control
                          - read_write
                          - read_only
        '422':
          description: invalid permission or member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sharing
              properties:
                sharing:
                  type: object
                  properties:
                    members:
                      type: array
                      items:
                        type: object
                        required:
                        - user_id
                        - permission
                        properties:
                          user_id:
                            type: string
                            format: uuid
                          permission:
                            type: string
                            enum:
                            - none
                            - full_control
                            - read_write
                            - read_only
                    include_in_finances:
                      type: boolean
        required: true
  "/api/v1/account_statements":
    get:
      summary: List statements in the Statement Vault
      description: 'Lists statements the caller can see: unlinked statements and statements
        linked to accounts shared with them. Requires an admin or member.'
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      parameters:
      - name: account_id
        in: query
        format: uuid
        required: false
        description: Only statements linked to this account
        schema:
          type: string
      - name: review_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - unmatched
          - linked
          - rejected
      - name: content_sha256
        in: query
        required: false
        description: Find the statement for a file by its SHA-256 (hex)
        schema:
          type: string
      - name: start_date
        in: query
        format: date
        required: false
        description: Only statements whose period ends on or after this date
        schema:
          type: string
      - name: end_date
        in: query
        format: date
        required: false
        description: Only statements whose period starts on or before this date
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Items per page (default: 25, max: 100)'
        schema:
          type: integer
      responses:
        '200':
          description: statements listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatementCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: guests cannot use the Statement Vault
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Upload a statement to the Statement Vault
      description: 'Stores a PDF, CSV or XLSX statement (max 25 MB). With account_id
        the statement is linked to that account (needs write access to it); without
        it the vault suggests a match to confirm in the app. The vault stores each
        file once: uploading the same file again returns the existing statement with
        meta.duplicate = true. Statements are archived only; no transactions are imported.'
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      parameters: []
