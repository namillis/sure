  "/api/v1/insights":
    get:
      summary: List proactive insights
      tags:
      - Insights
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: insights listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InsightCollection"
        '403':
          description: preview features disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/insights/{id}/acknowledge":
    patch:
      summary: Acknowledge a proactive insight
      tags:
      - Insights
      description: Marks a visible family insight read and acknowledged, removing
        it from the feed. Requires read_write scope and preview access. Repeated requests
        are idempotent.
      security:
      - apiKeyAuth: []
      - oauth2:
        - read_write
      parameters:
      - name: id
        in: path
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '204':
          description: insight acknowledged
        '401':
          description: authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: write scope, member access or preview features required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: insight not found or not visible to the family
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/merchants":
    get:
      summary: List merchants
      tags:
      - Merchants
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: merchants listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/MerchantDetail"
    post:
      summary: Import merchants from CSV
      tags:
      - Merchants
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: merchants imported
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MerchantImportResult"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: guest users cannot import merchants
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: missing file or invalid CSV
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
        required: true
        description: 'CSV file with columns: name* (required), color, website_url'
  "/api/v1/merchants/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Merchant ID
      schema:
        type: string
    get:
      summary: Retrieve a merchant
      tags:
      - Merchants
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: merchant retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MerchantDetail"
        '404':
          description: merchant not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update family merchant
      tags:
      - Merchants
      security:
      - apiKeyAuth: []
      description: Updates one of the family's own merchants (type FamilyMerchant).
        Provider merchants are read-only and return 403.
      parameters: []
      responses:
        '200':
          description: merchant updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MerchantDetail"
        '422':
          description: validation error - blank or duplicate name
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: forbidden - provider merchant, api key missing read_write scope,
            or guest user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: merchant not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: unauthorized - missing api key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - merchant
              properties:
                merchant:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Merchant name (unique within family)
                    color:
                      type: string
                      description: 'Hex color code (e.g. #4da568). An invalid or blank
                        color is replaced with a random palette color, as on the web.'
                    website_url:
                      type: string
                      nullable: true
                      description: Merchant website, used to fetch a logo when Brandfetch
                        is configured
        required: true
    delete:
      summary: Delete family merchant
      tags:
      - Merchants
      security:
      - apiKeyAuth: []
      description: Deletes one of the family's own merchants; its transactions keep
        no merchant. Provider merchants are read-only and return 403.
      responses:
        '204':
          description: merchant deleted
        '403':
          description: forbidden - provider merchant, api key missing read_write scope,
            or guest user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: merchant not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/users/me":
    get:
      summary: Retrieve the current user profile
      description: Returns the signed-in user's profile and display preferences, plus
        the household preferences that PATCH can change. Requires the read scope.
      tags:
      - Users
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: profile retrieved
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - email
                - first_name
                - last_name
                - role
                - theme
                - default_period
                - family
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  first_name:
                    type: string
                    nullable: true
                  last_name:
                    type: string
                    nullable: true
                  display_name:
                    type: string
                  role:
                    type: string
                    enum:
                    - guest
                    - member
                    - admin
                    - super_admin
                  locale:
                    type: string
                    nullable: true
                    description: User language; null follows the household locale
                  theme:
                    type: string
                    enum:
                    - light
                    - dark
                    - system
                  default_period:
                    type: string
                    example: last_30_days
                  family:
                    type: object
                    required:
                    - id
                    - name
                    - currency
                    - country
                    - timezone
                    - date_format
                    - locale
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        nullable: true
                      currency:
                        type: string
                        example: USD
                      country:
                        type: string
                        nullable: true
                        example: US
                      timezone:
                        type: string
                        nullable: true
                        example: America/New_York
                      date_format:
                        type: string
                        example: "%m-%d-%Y"
                      locale:
                        type: string
                        example: en
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update the current user profile
      description: Updates the signed-in user's name, language, theme and default
        period, and the household preferences in `family_attributes` (any member can
        change these, as on the web). Email, password, MFA and profile image are not
        accepted here. Requires the read_write scope.
      tags:
      - Users
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: profile updated
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - email
                - first_name
                - last_name
                - role
                - theme
                - default_period
                - family
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  first_name:
                    type: string
                    nullable: true
                  last_name:
                    type: string
                    nullable: true
                  display_name:
                    type: string
                  role:
                    type: string
                    enum:
                    - guest
                    - member
                    - admin
                    - super_admin
                  locale:
                    type: string
                    nullable: true
                    description: User language; null follows the household locale
                  theme:
                    type: string
                    enum:
                    - light
                    - dark
                    - system
                  default_period:
                    type: string
                    example: last_30_days
                  family:
                    type: object
                    required:
                    - id
                    - name
                    - currency
                    - country
                    - timezone
                    - date_format
                    - locale
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        nullable: true
                      currency:
                        type: string
                        example: USD
                      country:
                        type: string
                        nullable: true
                        example: US
                      timezone:
                        type: string
                        nullable: true
                        example: America/New_York
                      date_format:
                        type: string
                        example: "%m-%d-%Y"
                      locale:
                        type: string
                        example: en
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: read-only key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              properties:
                user:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    locale:
                      type: string
                      nullable: true
                      example: en
                    theme:
                      type: string
                      enum:
                      - light
                      - dark
                      - system
                    default_period:
                      type: string
                      example: last_90_days
                    family_attributes:
                      type: object
                      description: Admin only
                      properties:
                        currency:
                          type: string
                          example: EUR
                        country:
                          type: string
                          example: FR
                        timezone:
                          type: string
                          example: Europe/Paris
                        date_format:
                          type: string
                          example: "%d.%m.%Y"
                        locale:
                          type: string
                          example: fr
        required: true
    delete:
      summary: Delete account
      tags:
      - Users
      description: Permanently deactivates the current user account and all associated
        data. This action cannot be undone.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessMessage"
        '401':
          description: unauthorized
        '403':
          description: insufficient scope
        '422':
          description: deactivation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/provider_connections/{id}/sync":
    parameters:
    - name: id
      in: path
      required: true
      description: Provider connection ID
      schema:
        type: string
    - name: provider
      in: query
      required: false
      description: The connection's provider key from the list (e.g. plaid). Needed
        only when two connections share an id.
      schema:
        type: string
    post:
      summary: Queues a sync of one provider connection
      description: Queues a sync of one bank or broker connection, as the web's sync
        button does. A connection that is already syncing is not queued again. Plaid
        connections may be managed by their owner; every other provider requires a
        family admin.
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      responses:
        '202':
          description: sync queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderConnection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope or not allowed to manage this connection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: connection not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: the provider cannot be synced from the API (e.g. FinanceKit,
            or a connection that needs a new login)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/provider_connections/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Provider connection ID
      schema:
        type: string
    - name: provider
      in: query
      required: false
      description: The connection's provider key from the list (e.g. plaid). Needed
        only when two connections share an id.
      schema:
        type: string
    delete:
      summary: Disconnects a provider connection
      description: 'Disconnects a bank or broker connection as the web does: unlinks
        its accounts where that provider''s web flow does, then schedules the connection''s
        deletion in the background, which also removes it on the provider''s side.
        Accounts and their history stay. FinanceKit connections are disconnected through
        /api/v1/financekit/connections/{id}.'
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      responses:
        '202':
          description: disconnect scheduled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderConnection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope or not allowed to manage this connection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: connection not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: accounts could not be unlinked, so the connection was kept
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/provider_connections":
    post:
      summary: Creates a token-based provider connection
      description: 'Creates a connection from the credentials the provider''s web
        form takes, as that form does, and queues its first sync. Supported providers
        and their connection fields: simplefin (setup_token); lunchflow (api_key,
        base_url, name, sync_start_date); mercury and brex (token, base_url, name,
        sync_start_date); kraken, binance and coinspot (api_key, api_secret, name,
        sync_start_date); ibkr (query_id, token, name). Other providers return 422
        provider_not_supported. Credentials are never returned. Family admins only.'
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: connection created
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ProviderConnection"
                - type: object
                  required:
                  - setup_required
                  - awaiting_accounts
                  - pending_accounts
                  properties:
                    setup_required:
                      type: boolean
                      description: Accounts are waiting for setup, or will be once
                        the first sync finds them
                    awaiting_accounts:
                      type: boolean
                      description: The first sync hasn't found any accounts yet; poll
                        pending_accounts
                    pending_accounts:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - name
                        - balance
                        - balance_cents
                        - currency
                        - allowed_types
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: Provider account ID; send it back in complete_setup
                          name:
                            type: string
                          institution:
                            type: string
                            nullable: true
                          balance:
                            type: string
                            description: Formatted balance as the provider reports
                              it
                          balance_cents:
                            type: integer
