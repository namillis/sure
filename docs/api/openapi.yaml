    FinancekitMoney:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      - direction
      properties:
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,14})(\\.[0-9]{1,4})?$"
        currency:
          type: string
          pattern: "^[A-Z]{3,5}$"
        direction:
          type: string
          enum:
          - credit
          - debit
    FinancekitConsent:
      type: object
      additionalProperties: false
