    Transaction:
      type: object
      required:
      - id
      - entry_id
      - date
      - amount
      - amount_decimal
      - currency
      - name
      - classification
      - kind
      - excluded
      - split_parent
      - account
      - tags
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
          description: Id of the underlying entry. Web routes for a single transaction,
            such as /transactions/{entry_id}, use this id rather than id.
        date:
          type: string
          format: date
        amount:
          type: string
          description: Formatted amount, rounded to the currency display precision
        amount_decimal:
          type: string
          description: Exact stored amount as an unrounded, locale-independent decimal
            string. Positive is an outflow, negative an inflow.
        currency:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        external_id:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        user_modified:
          type: boolean
        classification:
          type: string
        kind:
          type: string
          enum:
          - standard
          - funds_movement
          - cc_payment
          - loan_payment
          - one_time
          - investment_contribution
          description: How budgets and reports treat the transaction. loan_payment
            counts as an expense; investment_contribution does too when the family
            counts investment contributions as spending, and is otherwise reported
            as invested and left out of spending and income; funds_movement, cc_payment
            and one_time are left out of budget totals.
        excluded:
          type: boolean
          description: Whether the transaction is excluded from budget and report
            totals. Splitting a transaction marks it excluded.
        split_parent:
          type: boolean
          description: Whether the transaction has been split; its amount is then
            carried by its split children.
        account:
          "$ref": "#/components/schemas/Account"
        category:
          "$ref": "#/components/schemas/Category"
          nullable: true
        merchant:
          "$ref": "#/components/schemas/Merchant"
          nullable: true
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/Tag"
        transfer:
          "$ref": "#/components/schemas/Transfer"
          nullable: true
        pending:
          type: boolean
          description: Whether the bank still reports the transaction as pending.
        duplicate_suspected:
          type: boolean
          description: Whether a sync flagged this pending transaction as possibly
            the same purchase as a posted one, and the user has not dismissed it.
            Resolve with merge_duplicate or dismiss_duplicate.
        duplicate_confidence:
          type: string
          enum:
          - low
          - medium
          - high
          nullable: true
          description: How sure the match is. The web shows low as "Review" and the
            others as "Possible duplicate".
        duplicate_candidate:
          type: object
          nullable: true
          description: The suggested posted transaction, or null.
          required:
          - id
          - entry_id
          - date
          - name
          - amount
          - amount_cents
          - signed_amount_cents
          - currency
          properties:
            id:
              type: string
              format: uuid
            entry_id:
              type: string
              format: uuid
            date:
              type: string
              format: date
            name:
              type: string
            amount:
              type: string
            amount_cents:
              type: integer
            signed_amount_cents:
              type: integer
            currency:
              type: string
        sync_locked:
          type: boolean
          description: Whether the transaction is protected from bank sync because
            the user edited it or it came from an import (the web's "Protected from
            sync" panel). Unlock with POST unlock.
        locked_attributes:
          type: array
          description: The fields the user changed, which a sync will not overwrite,
            with when each was locked. Names are the attribute names, e.g. name, date,
            amount, notes, category_id, merchant_id.
          items:
            type: object
            required:
            - field
            - locked_at
            properties:
              field:
                type: string
              locked_at:
                type: string
                format: date-time
                nullable: true
        reconciled_status:
          type: string
          enum:
          - unreconciled
          - cleared
          - reconciled
          description: Manual statement check-off status. See PATCH reconcile.
        reconcilable:
          type: boolean
          description: 'Whether to offer the reconcile control: the family turned
            on manual reconciliation, the account has no bank sync, and the user can
            edit the account.'
        attachments:
          type: array
          description: Receipts and other files attached to the transaction (Sure+
            feature transactions.attachments).
          items:
            "$ref": "#/components/schemas/TransactionAttachment"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TransactionAttachment:
      type: object
      required:
      - id
      - filename
      - content_type
      - byte_size
