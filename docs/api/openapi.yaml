  "/api/v1/settings/ai":
    get:
      summary: Show the AI prompts and classifier settings
      tags:
      - Settings
      security:
      - apiKeyAuth: []
      description: Settings → AI prompts and Settings → Classifier. Family admins
        only, as the web page is; members and guests get 403 `forbidden`. Never includes
        provider keys.
      responses:
        '200':
          description: AI settings
          content:
            application/json:
              schema:
                type: object
                required:
                - ai_settings
                properties:
                  ai_settings:
                    type: object
                    required:
                    - ai_available
                    - ai_enabled
                    - prompt_max_length
                    - prompts
                    - classifier
                    properties:
                      ai_available:
                        type: boolean
                        description: Whether this server has an AI provider for the
                          user (User#ai_available?)
                      ai_enabled:
                        type: boolean
                        description: Whether the user has AI turned on and it is available
                      prompt_max_length:
                        type: integer
                      prompts:
                        type: array
                        items:
                          type: object
                          required:
                          - key
                          - value
                          - default
                          - custom
                          - format_risk
                          - format_risk_key
                          properties:
                            key:
                              type: string
                              enum:
                              - chat_system
                              - categorizer_openai
                              - categorizer_anthropic
                              - merchant_openai
                              - merchant_anthropic
                              - insight_dig_in
                            value:
                              type: string
                              nullable: true
                              description: The family's override, or null when it
                                runs the default
                            default:
                              type: string
                              description: The built-in prompt this server sends without
                                an override
                            custom:
                              type: boolean
                            format_risk:
                              type: boolean
                              description: The override dropped the JSON key the custom-endpoint
                                prompt asks for (advisory)
                            format_risk_key:
                              type: string
                              nullable: true
                      classifier:
                        type: object
                        required:
                        - settings
                        - defaults
                        - default
                        - ranges
                        - choices
                        - rules
                        - evaluation
                        properties:
                          settings:
                            type: object
                            additionalProperties: true
                            description: Every Family::BayesSettings value
                          defaults:
                            type: object
                            additionalProperties: true
                          default:
                            type: boolean
                            description: All settings are at their defaults
                          ranges:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                min:
                                  type: number
                                max:
                                  type: number
                          choices:
                            type: object
                            additionalProperties:
                              type: array
                              items:
                                type: string
                          rules:
                            type: array
                            items:
                              type: object
                              required:
                              - action_type
                              - name
                              - exists
                              - active
                              properties:
                                action_type:
                                  type: string
                                  enum:
                                  - fill_similar_merchants
                                  - bayes_categorize
                                name:
                                  type: string
                                exists:
                                  type: boolean
                                  description: False once the rule was deleted on
                                    the Rules page
                                active:
                                  type: boolean
                          evaluation:
                            type: object
                            properties:
                              running:
                                type: boolean
                              ran_at:
                                type: string
                                format: date-time
                                nullable: true
                              action:
                                type: string
                                nullable: true
                              settings_changed_since:
                                type: boolean
                                nullable: true
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update the AI prompts and classifier settings
      tags:
      - Settings
      security:
      - apiKeyAuth: []
      description: |
        Family admins only, as the web page is; members and guests get 403 `forbidden`. Needs `read_write`. Send any of the three parts; the rest stay as they are.
        A blank or null prompt resets it to the default. Classifier numbers are clamped to `ranges`, as on the web.
        Turning on a classifier rule that was deleted returns 422 `classifier_rule_missing`; add it with
        `POST /api/v1/settings/ai/classifier/rules`. All changes save together or not at all.
      parameters: []
      responses:
        '200':
          description: AI settings updated
