          description: Malformed or unsupported protocol
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FinancekitError"
        '401':
          description: Invalid publisher credential
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FinancekitError"
        '409':
          description: Digest, sequence, predecessor, generation, or idempotency conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FinancekitError"
        '413':
          description: Payload or record limit exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FinancekitError"
        '429':
          description: Publisher inbox full
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FinancekitError"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FinancekitBatch"
        required: true
