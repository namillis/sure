      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Pledge a contribution to a goal
      tags:
      - Goals
      description: Records that the user just moved money toward the goal. Sync matches
        the pledge against the incoming transfer (or a manual balance update) and
        closes it; unmatched pledges expire after 7 days. Returns the pledge and the
        refreshed goal.
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: pledge created
          content:
