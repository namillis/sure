  "/api/v1/cash_flow":
    get:
      summary: Show cash flow and optional Sankey graph
      tags:
      - Cash Flow
      description: Server-calculated income, spending, savings, and daily cumulative
        comparison in family currency. Uses the authenticated user’s finance accounts
        and Sure reporting rules. Browser sessions do not authenticate this public
        API.
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Non-future first day YYYY-MM-01; defaults to the current month
          in the family time zone.
      - name: include
        in: query
        required: false
        schema:
          type: string
          enum:
          - sankey
        description: Append server-calculated graph to the monthly summary; cannot
          combine with view.
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - sankey
        description: Graph-only envelope; omits daily comparison. Accepts month or
          an explicit date range; cannot combine with include.
      - name: group_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - category
          - account
          default: category
        description: 'Requires view=sankey. category: flows through one Cash Flow
          node; account: income categories flow through each account to expense categories
          (basis net_by_account).'
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive ISO date. Requires end_date and view=sankey; cannot
          combine with month.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive ISO date at or after start_date. Explicit ranges preserve
          their bounds, including future dates.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: summary returned
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/CashFlow"
                - "$ref": "#/components/schemas/CashFlowGraph"
        '422':
          description: invalid query
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
