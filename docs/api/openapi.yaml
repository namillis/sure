  "/api/v1/goals":
    get:
      summary: List goals
      tags:
      - Goals
      description: All family goals with the progress figures the web goal card shows.
        Active goals first (needing attention first), then completed, then archived.
        Requires preview features.
      security:
      - apiKeyAuth: []
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - paused
          - completed
          - archived
      responses:
        '200':
          description: goals listed
          content:
            application/json:
              schema:
                type: object
                required:
                - goals
                properties:
                  goals:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - kind
                      - target_mode
                      - state
                      - status
                      - display_status
                      - currency
                      - target_amount
                      - target_amount_cents
                      - current_amount_cents
                      - progress_amount_cents
                      - remaining_amount_cents
                      - progress_percent
                      - open_pledges
                      - linked_accounts
