                properties:
                  ai_settings:
                    type: object
                    required:
                    - ai_available
                    - ai_enabled
                    - prompt_max_length
                    - prompts
                    - classifier
                    properties:
                      ai_available:
                        type: boolean
                        description: Whether this server has an AI provider for the
                          user (User#ai_available?)
                      ai_enabled:
                        type: boolean
                        description: Whether the user has AI turned on and it is available
                      prompt_max_length:
                        type: integer
                      prompts:
                        type: array
                        items:
                          type: object
                          required:
                          - key
                          - value
                          - default
                          - custom
                          - format_risk
                          - format_risk_key
                          properties:
                            key:
                              type: string
                              enum:
                              - chat_system
                              - categorizer_openai
                              - categorizer_anthropic
                              - merchant_openai
                              - merchant_anthropic
                              - insight_dig_in
                            value:
                              type: string
                              nullable: true
                              description: The family's override, or null when it
                                runs the default
                            default:
                              type: string
                              description: The built-in prompt this server sends without
                                an override
                            custom:
                              type: boolean
                            format_risk:
                              type: boolean
                              description: The override dropped the JSON key the custom-endpoint
                                prompt asks for (advisory)
                            format_risk_key:
                              type: string
                              nullable: true
                      classifier:
                        type: object
                        required:
                        - settings
                        - defaults
                        - default
                        - ranges
                        - choices
                        - rules
                        - evaluation
                        properties:
                          settings:
                            type: object
                            additionalProperties: true
                            description: Every Family::BayesSettings value
                          defaults:
                            type: object
                            additionalProperties: true
                          default:
                            type: boolean
                            description: All settings are at their defaults
                          ranges:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                min:
                                  type: number
                                max:
                                  type: number
                          choices:
                            type: object
                            additionalProperties:
                              type: array
                              items:
                                type: string
                          rules:
                            type: array
                            items:
                              type: object
                              required:
                              - action_type
                              - name
                              - exists
                              - active
                              properties:
                                action_type:
                                  type: string
                                  enum:
                                  - fill_similar_merchants
                                  - bayes_categorize
                                name:
                                  type: string
                                exists:
                                  type: boolean
                                  description: False once the rule was deleted on
                                    the Rules page
                                active:
                                  type: boolean
                          evaluation:
                            type: object
                            properties:
                              running:
                                type: boolean
                              ran_at:
                                type: string
                                format: date-time
                                nullable: true
                              action:
                                type: string
                                nullable: true
                              settings_changed_since:
                                type: boolean
                                nullable: true
        '422':
          description: invalid settings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - ai_settings
              properties:
                ai_settings:
                  type: object
                  properties:
                    prompts:
                      type: object
                      additionalProperties:
                        type: string
                        nullable: true
                      description: Prompt key => text
                    classifier:
                      type: object
                      properties:
                        settings:
                          type: object
                          additionalProperties: true
                          description: Any classifier setting keys, e.g. threshold,
                            excluded_category_ids
                        rules_active:
                          type: object
                          additionalProperties:
                            type: boolean
                          description: action_type => on/off
