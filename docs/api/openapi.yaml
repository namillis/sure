        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: object
                  properties:
                    accountable_type:
                      type: string
                      enum:
                      - Depository
                      - Investment
                      - Crypto
                      - Property
                      - Vehicle
                      - OtherAsset
                      - CreditCard
                      - Loan
                      - OtherLiability
                      - depository
                      - investment
                      - crypto
                      - property
                      - vehicle
                      - other_asset
                      - credit_card
                      - loan
                      - other_liability
                      description: Account type, as the class name (CreditCard) or
                        as account_type in responses (credit_card). Required on create;
                        on update it may only repeat the current type
                    name:
                      type: string
                    balance:
                      type: number
                      description: Current balance. Not allowed on linked accounts
                    currency:
                      type: string
                      description: Defaults to the family currency on create. Not
                        allowed on linked accounts
                    subtype:
                      type: string
                      nullable: true
                      description: The type's subtype (e.g. checking, savings, mortgage,
                        brokerage)
                    opening_balance_date:
                      type: string
                      format: date
                      description: Create only. Defaults to two years ago; a loan
                        with initial_balance opens on its start_date
                    institution_name:
                      type: string
                      nullable: true
                    institution_domain:
                      type: string
                      nullable: true
                    notes:
                      type: string
                      nullable: true
                    exclude_from_reports:
                      type: boolean
                      description: Not used for Property
                    enable_category_matcher:
                      type: boolean
                      description: Not used for Property
                    accountable_attributes:
                      type: object
                      description: 'Fields of the account''s type. CreditCard: available_credit,
                        minimum_payment, apr, annual_fee, expiration_date, statement_close_day,
                        due_day. Loan: subtype, rate_type, interest_rate, term_months,
                        initial_balance, start_date, down_payment, insurance_rate,
                        insurance_rate_type, day_count_convention, principal_only_transfers,
                        rate_changes [{effective_date (YYYY-MM-DD), rate (0-100)}]
                        replaces the whole list ([] clears it, leaving it out keeps
                        it). Investment: subtype. Crypto: subtype, tax_treatment.
                        Property: subtype, year_built, area_value, area_unit, address_attributes
                        {line1, line2, locality, region, country, postal_code}. Vehicle:
                        make, model, year, mileage_value, mileage_unit, initial_balance,
                        initial_balance_shown, purchase_date (the last three not on
                        linked accounts). Depository, OtherAsset, OtherLiability:
                        none. Other keys are ignored'
                      additionalProperties: true
