  "/api/v1/spending_vs_normal":
    get:
      summary: Show spending per category against normal
      tags:
      - Reports
      description: 'Net spending per category in a period, compared with each category''s
        normal. For a finished period, normal is its net spending over the year before
        the period, scaled to the period length. An unfinished period (in_progress)
        is cut to today and compared with the average of the same number of days from
        each of up to 12 earlier month starts, counting only windows that end before
        the period. The data behind the Reports section "Spending vs normal". Uses
        the authenticated user''s finance accounts and Sure reporting rules. Experimental:
        the section is a preview feature, and how normal is defined may still change.'
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive ISO date. Requires end_date; both omitted means the
          current month to date.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive ISO date at or after start_date.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: comparison returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SpendingVsNormal"
        '422':
          description: invalid period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{transaction_id}/split":
    parameters:
    - name: transaction_id
      in: path
      description: Transaction ID. A split child resolves to its parent.
      required: true
      schema:
        type: string
    post:
      summary: Split a transaction
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Splits a transaction into child transactions. The child amounts
        must sum exactly to the parent amount, using the same sign convention the
        transaction endpoints return. The parent becomes excluded from totals.
      parameters: []
      responses:
        '201':
          description: transaction split
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Split"
        '422':
          description: amounts do not sum to the parent, or the transaction cannot
            be split
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SplitRequest"
    get:
      summary: Retrieve a transaction split
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Returns the child transactions of a split.
      responses:
        '200':
          description: split returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Split"
        '404':
          description: transaction is not split
    patch:
      summary: Replace a transaction split
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Replaces the children of an existing split. The previous children
        are destroyed, so anything set on them afterwards is not carried over. Send
        each child in full, including its merchant_id and tag_ids. A child without
        a merchant_id takes the parent's merchant.
      parameters: []
      responses:
        '200':
          description: split replaced
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Split"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SplitRequest"
    delete:
      summary: Remove a transaction split
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Removes the children and restores the parent transaction.
      responses:
        '204':
          description: split removed
        '404':
          description: transaction is not split
