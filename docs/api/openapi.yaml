                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/provider_connections/available":
    get:
      summary: Lists the connections the user may add
      description: 'The providers this server lets the user connect, as /settings/providers
        and the Plaid link page offer them: every provider panel for admins, plus
        Plaid when the instance has Plaid credentials (members get Plaid only, guests
        nothing). connect_path is a web handoff path. kind is token when the app can
        create the connection natively from a token or API key, otherwise web.'
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: available connections listed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - provider
                      - key
                      - name
                      - connect_path
                      - kind
                      properties:
                        provider:
                          type: string
                          description: Matches provider on GET /api/v1/provider_connections
                        key:
                          type: string
                          description: Unique per entry, e.g. plaid_us and plaid_eu
                        name:
                          type: string
                        connect_path:
                          type: string
                          example: "/settings/providers/simplefin/connect_form"
                        kind:
                          type: string
                          enum:
                          - web
                          - token
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
