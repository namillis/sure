    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    - name: disposition
      in: query
      required: false
      description: attachment to ask for a download; inline (default) otherwise
      schema:
        type: string
        enum:
        - inline
        - attachment
    get:
      summary: Download an attachment
      description: Streams the file. This is the url in each transaction attachment.
        It needs the same credentials as any other call; any share of the account
        may download.
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: the file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: attachment not found, or on an account the caller cannot see
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{id}/merge_duplicate":
    parameters:
    - name: id
      in: path
      description: Pending transaction ID
      required: true
      schema:
        type: string
    post:
      summary: Merge a pending transaction into its suggested duplicate
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: 'For a pending transaction whose duplicate_suspected is true: confirms
        that it and duplicate_candidate are the same purchase. The pending transaction
        is deleted and the posted one is kept. Unless the posted transaction was already
        locked against sync, it takes the pending date and category; it keeps its
        own name and merchant, gains the pending notes, tags and attachments, and
        is then locked against sync changes. Returns the surviving posted transaction.
        Needs owner or full-control access to the account.'
      responses:
        '200':
          description: merged; the surviving posted transaction
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '422':
          description: not pending (not_pending), no suggestion (no_duplicate), or
            the merge was refused (merge_failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{id}/dismiss_duplicate":
    parameters:
    - name: id
      in: path
      description: Pending transaction ID
      required: true
      schema:
        type: string
    post:
      summary: Keep both transactions
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Says the suggested duplicate is a different purchase. The suggestion
        is hidden (duplicate_suspected becomes false) and both transactions stay.
        Returns the transaction. Needs owner or full-control access to the account.
      responses:
        '200':
          description: suggestion dismissed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '422':
          description: no suggestion to dismiss (no_duplicate)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{id}/pending_merge_candidates":
    parameters:
    - name: id
      in: path
      description: Pending transaction ID
      required: true
      schema:
        type: string
    - name: offset
      in: query
      required: false
      description: Number of candidates to skip. Pages are 10 long.
      schema:
        type: integer
    get:
      summary: List posted transactions a pending one can be merged into
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: The recent posted transactions in the same account and currency,
        newest first, that the user can pick when the bank booked a pending transaction
        under a different amount or name. Pass a candidate's entry_id to pending_merge.
      responses:
        '200':
          description: candidates listed
          content:
            application/json:
              schema:
                type: object
                required:
                - candidates
                - pagination
                properties:
                  candidates:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Transaction"
                  pagination:
                    type: object
                    required:
                    - offset
                    - limit
                    - has_more
                    properties:
                      offset:
                        type: integer
                      limit:
                        type: integer
                      has_more:
                        type: boolean
        '422':
          description: the transaction is not pending (not_pending)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{id}/pending_merge":
    parameters:
    - name: id
      in: path
      description: Pending transaction ID
      required: true
      schema:
        type: string
    post:
      summary: Merge a pending transaction into a chosen posted transaction
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Merges the pending transaction into a posted one the user picked
        from pending_merge_candidates, with the same result as merge_duplicate. Returns
        the surviving posted transaction. Needs owner, full-control or read-write
        access to the account, as on the web.
      parameters: []
      responses:
        '200':
          description: merged; the surviving posted transaction
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '422':
          description: missing posted_entry_id (validation_failed), not a candidate
            (invalid_posted_entry), not pending (not_pending) or the merge was refused
            (merge_failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pending_merge
              properties:
                pending_merge:
                  type: object
                  required:
                  - posted_entry_id
                  properties:
                    posted_entry_id:
                      type: string
                      format: uuid
                      description: entry_id of a pending_merge_candidates item
  "/api/v1/transactions/{id}/unlock":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: string
    post:
      summary: Let bank sync update a transaction again
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Removes the sync protection a user edit or an import put on the
        transaction (sync_locked and locked_attributes). The next bank sync may then
        overwrite the user's changes. Returns the transaction. Needs owner or full-control
        access to the account.
      responses:
        '200':
          description: unlocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '403':
          description: read-only key, or no write access to the account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{id}/reconcile":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: string
    patch:
      summary: Advance the reconciled status
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: 'Reconciling means ticking a transaction off against a bank or
        card statement, the way you would in a paper checkbook. It is only for accounts
        without bank sync, and only when the family has turned on manual reconciliation
        (the transaction''s reconcilable is true). Each call moves reconciled_status
        one step: unreconciled ("Not yet checked against a statement") to cleared
        ("Seen on a statement, not fully reconciled yet") to reconciled ("Statement
        period fully reconciled") and back to unreconciled. The web labels the control
        with the current status: Unreconciled, Cleared or Reconciled. Takes no body,
        like the web. Returns the transaction. Needs owner or full-control access
        to the account.'
      responses:
        '200':
          description: status advanced
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '422':
          description: manual reconciliation is off (reconciliation_disabled), the
            account has bank sync (not_manual_account), or the update failed (reconcile_failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{id}/mark_as_recurring":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: string
    post:
      summary: Mark a transaction as recurring
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Creates a manual recurring transaction from this transaction, as
        the web's "Mark as recurring" does. Returns 409 with the existing recurring
        transaction when one already covers this transaction or holds the same pattern
        (an ended one included); `recurring_transaction` is null when you cannot see
        it. Needs write access (owner or full control) to the account. Requires the
        `read_write` scope.
      responses:
        '201':
          description: recurring transaction created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RecurringTransaction"
        '409':
          description: a recurring transaction already exists
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                - recurring_transaction
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  recurring_transaction:
                    "$ref": "#/components/schemas/RecurringTransaction"
                    nullable: true
  "/api/v1/transactions/{id}/convert_to_trade":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: string
    get:
      summary: Get the defaults for converting a transaction to a trade
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: Returns what the web "Convert to trade" form starts with. The trade
        is always booked in the transaction's own account, which must be an investment
        account or a crypto exchange. security_options lists the securities the account
        already holds, with today's stored price when there is one. When ticker_search_available
        is true, a typed ticker sent as custom_ticker is looked up through the securities
        provider. Requires write access to the account, as on the web.
      responses:
        '200':
          description: conversion defaults
          content:
            application/json:
              schema:
                type: object
                required:
                - transaction_id
                - date
                - name
                - amount
                - amount_cents
                - currency
                - account
                - defaults
                - investment_activity_labels
                - ticker_search_available
                - security_options
                properties:
                  transaction_id:
                    type: string
                    format: uuid
                  date:
                    type: string
                    format: date
                  name:
                    type: string
                  amount:
                    type: string
                    description: Unsigned, formatted
                  amount_cents:
                    type: integer
                    description: Unsigned, in minor units
                  currency:
                    type: string
                  account:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      account_type:
                        type: string
                  defaults:
                    type: object
                    properties:
                      investment_activity_label:
                        type: string
                        enum:
                        - Buy
                        - Sell
                        description: Buy for money out, Sell for money in
                      security_id:
                        type: string
                        nullable: true
                      qty:
                        type: string
                        nullable: true
                      price:
                        type: string
                        nullable: true
                  investment_activity_labels:
                    type: array
                    items:
                      type: string
                  ticker_search_available:
                    type: boolean
                  security_options:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        ticker:
                          type: string
                        name:
                          type: string
                          nullable: true
                        exchange_operating_mic:
                          type: string
                          nullable: true
                        current_price:
                          type: string
                          nullable: true
                        current_price_cents:
                          type: integer
                          nullable: true
                        current_price_currency:
                          type: string
                          nullable: true
        '422':
          description: the account cannot hold trades, or the transaction is already
            converted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Convert a transaction to a trade
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: 'Creates a trade in the transaction''s account with the transaction''s
        date and currency, and excludes the original transaction, as the web does.
        Identify the security with security_id, ticker ("SYMBOL|EXCHANGE|PROVIDER")
        or custom_ticker. Send qty or price; the other is inferred from the transaction
        amount. Without investment_activity_label, money out is a Buy and money in
        is a Sell. Errors return 422 with error set to the web''s reason: not_investment_account,
        already_converted, select_security, security_not_found, enter_ticker, enter_qty_or_price,
        invalid_qty_or_price, or validation_failed.'
      parameters: []
      responses:
        '201':
          description: trade created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Trade"
        '422':
          description: invalid security, quantity or price
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - trade
              properties:
                trade:
                  type: object
                  properties:
                    security_id:
                      type: string
                      format: uuid
                    ticker:
                      type: string
                      description: Securities search id, SYMBOL|EXCHANGE|PROVIDER
                    custom_ticker:
                      type: string
                    exchange_operating_mic:
                      type: string
                    qty:
                      type: number
                    price:
                      type: number
                    investment_activity_label:
                      type: string
                      enum:
                      - Buy
                      - Sell
                    trade_name:
                      type: string
  "/api/v1/transactions/{id}/transfer_candidates":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: string
    get:
      summary: List transfer match candidates
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: 'What the web''s "match as transfer" dialog offers. `candidates`
        are existing opposite transactions on accounts you can write to, likeliest
        first; pass a candidate''s `transaction.entry_id` as `matched_entry_id` to
        match it. `accounts` are the accounts `method: "new"` can create the other
        side in. Requires the `read` scope.'
      responses:
        '200':
          description: candidates returned
          content:
            application/json:
              schema:
                type: object
                required:
                - candidates
                - accounts
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      required:
                      - transaction
                      - account
                      properties:
                        transaction:
                          "$ref": "#/components/schemas/Transaction"
                        account:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                  accounts:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - account_type
                      - currency
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        account_type:
                          type: string
                        currency:
                          type: string
        '404':
          description: transaction not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transactions/{id}/transfer_match":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: string
    post:
      summary: Mark a transaction as a transfer
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: 'Links the transaction into a confirmed transfer, as the web''s
        "match as transfer" dialog does. `method: "existing"` pairs it with `matched_entry_id`
        (an entry id from `transfer_candidates`); `method: "new"` creates the opposite
        transaction in `target_account_id`. Needs write access (owner or full control)
        to both accounts. Returns 422 with a `reason` (not_a_candidate, already_linked,
        same_account, split_transaction, excluded_transaction, invalid_transfer) when
        the pair is not valid. Requires the `read_write` scope.'
      parameters: []
      responses:
        '201':
          description: transfer created
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer
                - inflow
                - outflow
                properties:
                  transfer:
                    "$ref": "#/components/schemas/TransferDecision"
                  inflow:
                    "$ref": "#/components/schemas/Transaction"
                  outflow:
                    "$ref": "#/components/schemas/Transaction"
        '422':
          description: the pair cannot form a transfer
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - transfer_match
              properties:
                transfer_match:
                  type: object
                  required:
                  - method
                  properties:
                    method:
                      type: string
                      enum:
                      - existing
                      - new
                    matched_entry_id:
                      type: string
                      format: uuid
                      description: Entry id of the other side, for method existing
                    target_account_id:
                      type: string
                      format: uuid
                      description: Account for the new other side, for method new
    delete:
      summary: Unmatch a transfer
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: When the transaction is part of a transfer, removes the transfer
        and records the pair as rejected so automatic matching does not pair them
        again (the web's "Reject match"). Otherwise records every pair the web's transfer
        hint suggests for it as rejected (the web's "Not a transfer"). Returns the
        transaction. Requires the `read_write` scope.
      responses:
        '200':
          description: unmatched
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
