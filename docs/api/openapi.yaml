              schema:
                type: object
                required:
                - data
                - awaiting_accounts
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - balance
                      - balance_cents
                      - currency
                      - allowed_types
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Provider account ID; send it back in complete_setup
                        name:
                          type: string
                        institution:
                          type: string
                          nullable: true
                        balance:
                          type: string
                          description: Formatted balance as the provider reports it
                        balance_cents:
                          type: integer
                        currency:
                          type: string
                        suggested_accountable_type:
                          type: string
                          nullable: true
                          description: What the web form preselects; null means it
                            preselects Skip
                        suggested_subtype:
                          type: string
                          nullable: true
                        allowed_types:
                          type: array
                          description: The types the web setup form offers for this
                            provider, with their subtypes
                          items:
                            type: object
                            required:
                            - accountable_type
                            - label
