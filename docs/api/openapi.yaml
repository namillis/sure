    delete:
      summary: Revoke a publisher, retaining or discarding imported financial history
      tags:
      - FinanceKit
      security:
      - apiKeyAuth: []
      - oauth2:
        - read_write
      parameters:
      - name: disposition
        in: query
        required: false
        schema:
          type: string
          enum:
          - retain
          - discard
        description: 'What happens to the data this connection imported. retain (the
          default) keeps every account, balance and transaction. discard removes them:
          accounts FinanceKit created are destroyed, accounts it was linked to are
          emptied of FinanceKit-sourced entries and rebalanced, and source identities,
          balance observations and conflicts are deleted. Irreversible, and it removes
          imported entries the family later reconciled, excluded or edited. Supported
          dispositions are advertised by GET /api/v1/financekit/capabilities.'
      responses:
        '204':
          description: Publisher revoked, imported history retained
