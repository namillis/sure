      summary: Open a budget month
      tags:
      - Budgets
      security:
      - apiKeyAuth: []
      description: Creates the budget row for a month the way opening it on the web
        does, with a row for every category. Returns 201 when it was created and 200
        when it already existed. Another member's month is only returned if it already
        exists; it is never created on their behalf.
      parameters:
      - name: owner
        in: query
        required: false
        description: 'Whose budget: omit for your own (the household budget when personal
          budgets are off), "household", or the user id of a member who shared their
          budget with you'
        schema:
          type: string
      responses:
        '201':
          description: budget month created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Budget"
        '200':
          description: budget month already existed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Budget"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: forbidden - requires read_write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: malformed month, or outside the range budgets can be set up
            for
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - budget
              properties:
                budget:
                  type: object
                  required:
                  - month
                  properties:
                    month:
                      type: string
                      example: 2026-12
                      description: Month as YYYY-MM
        required: true
