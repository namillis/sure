  "/api/v1/family/members":
    get:
      summary: List household members and pending invitations
      description: Sure+ `household.members`. The members and pending invitations
        Settings > Profile shows. Invitation tokens and accept links are never returned.
        `avatar_url` is a short-lived signed URL, or null when there is no avatar
        or the storage service is public. `invitations_enabled` is false on a self-hosted
        server closed to sign-ups. `invitation_delivery` is `link_only` on self-hosted
        servers, which send no invitation email; the admin shares the link from the
        web.
      tags:
      - Household (Sure+)
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: members listed
          content:
            application/json:
              schema:
                type: object
                required:
                - members
                - pending_invitations
                - can_manage_invitations
                - invitations_enabled
                - invitation_delivery
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - email
                      - role
                      - avatar_url
                      - is_current_user
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                          - guest
                          - member
                          - admin
                          - super_admin
                        avatar_url:
                          type: string
                          nullable: true
                        is_current_user:
                          type: boolean
                  pending_invitations:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - email
                      - role
                      - created_at
                      - expires_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                          - admin
                          - member
                          - guest
                        created_at:
                          type: string
                          format: date-time
                        expires_at:
                          type: string
                          format: date-time
                  can_manage_invitations:
                    type: boolean
                  invitations_enabled:
                    type: boolean
                  invitation_delivery:
                    type: string
                    enum:
                    - email
                    - link_only
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/invitations":
    post:
      summary: Invite someone to the household
      description: Sure+ `household.members`. Admins only, as on the web. Sends the
        web's invitation email (managed servers only). 422 `validation_failed` for
        a bad email or role, an existing member, an existing pending invitation or
        the admin's own email; 422 `invitations_disabled` when the self-hosted server
        is closed to sign-ups.
      tags:
      - Household (Sure+)
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: invitation created
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - email
                - role
                - created_at
                - expires_at
                - delivery
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                    - admin
                    - member
                    - guest
                  created_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
                  delivery:
                    type: string
                    enum:
                    - email
                    - link_only
        '422':
          description: invalid, duplicate or disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - invitation
              properties:
                invitation:
                  type: object
                  required:
                  - email
                  - role
                  properties:
                    email:
                      type: string
                    role:
                      type: string
                      enum:
                      - admin
                      - member
                      - guest
        required: true
  "/api/v1/invitations/bulk":
    post:
      summary: Invite several people at once
      description: 'Sure+ `household.members`. The web''s bulk invite: members and
        guests only (no admin), at most 50 addresses. `emails` is an array or the
        web''s comma/space separated string. Each address gets a result: `sent`, `link_only`
        (self-hosted, no email) or `invalid` with `detail`.'
      tags:
      - Household (Sure+)
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: batch processed
          content:
            application/json:
              schema:
                type: object
                required:
                - sent
                - link_only
                - invalid
                - results
                properties:
                  sent:
                    type: integer
                  link_only:
                    type: integer
                  invalid:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                        status:
                          type: string
                          enum:
                          - sent
                          - link_only
                          - invalid
                        detail:
                          type: string
                          nullable: true
        '422':
          description: bad role, empty or too many
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - bulk_invitation
              properties:
                bulk_invitation:
                  type: object
                  required:
                  - emails
                  - role
                  properties:
                    emails:
                      oneOf:
                      - type: array
                        items:
                          type: string
                      - type: string
                    role:
                      type: string
                      enum:
                      - member
                      - guest
        required: true
  "/api/v1/invitations/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Revoke an invitation
      description: Sure+ `household.members`. Admins only.
      tags:
      - Household (Sure+)
      security:
      - apiKeyAuth: []
      responses:
        '204':
          description: invitation revoked
        '404':
          description: not found
  "/api/v1/import_sessions":
    post:
      summary: Create import session
      description: Create or idempotently retrieve a multi-file SureImport session
        keyed by client_session_id.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: import session created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope or guest user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: client session conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - SureImport
                  description: Import session type. Only SureImport is supported.
                client_session_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for the full import
                    session.
                expected_chunks:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Expected number of ordered chunks before publish is
                    allowed.
  "/api/v1/import_sessions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    get:
      summary: Retrieve import session
      description: Retrieve import session status, chunk status, per-entity summary
        counts, and safe error details.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: import session retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/import_sessions/{id}/chunks":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    post:
      summary: Upload import session chunk
      description: Attach an ordered Sure NDJSON chunk to an import session. Chunks
        are idempotent by sequence and client_chunk_id with content verification.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sequence
              - raw_file_content
              properties:
                sequence:
                  type: integer
                  minimum: 1
                  description: One-based chunk sequence. Earlier dependency chunks
                    must have lower sequence numbers.
                client_chunk_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for this chunk.
                raw_file_content:
                  type: string
                  description: Raw Sure NDJSON content. Each chunk is limited to 10MB.
          multipart/form-data:
            schema:
              type: object
              required:
              - sequence
              - file
              properties:
                sequence:
                  type: integer
                  minimum: 1
                  description: One-based chunk sequence. Earlier dependency chunks
                    must have lower sequence numbers.
                client_chunk_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for this chunk.
                file:
                  type: string
                  format: binary
                  description: Multipart Sure NDJSON file upload. Each chunk is limited
                    to 10MB.
      parameters: []
      responses:
        '201':
          description: chunk uploaded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: chunk conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: missing or invalid content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/import_sessions/{id}/publish":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    post:
      summary: Publish import session
      description: Queue ordered chunk processing for a SureImport session. Later
        chunks can reference source IDs mapped by earlier chunks.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      responses:
        '202':
          description: import session publish queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: max_row_count_exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: missing expected chunks
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: enqueue failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
