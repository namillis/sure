      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Durably accept an ordered FinanceKit publisher batch
      tags:
      - FinanceKit
      security:
      - financekitPublisher: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: X-Sure-Payload-SHA256
        in: header
        required: false
        schema:
          type: string
          pattern: "^[0-9a-f]{64}$"
      responses:
        '202':
          description: Immutable bytes accepted into the inbox
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FinancekitBatchReceipt"
