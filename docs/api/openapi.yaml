  "/api/v1/rules/apply_all":
    post:
      summary: Apply all rules to existing transactions
      tags:
      - Rules
      description: 'Runs every rule of the family, active or not, top to bottom, as
        the web "Apply all" does. Without confirm: true it changes nothing and returns
        what the web confirmation shows. With it, the run is queued (202); each rule''s
        run then appears in GET /api/v1/rule_runs.'
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '202':
          description: rules queued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - status
                    - rule_count
                    properties:
                      status:
                        type: string
                        enum:
                        - queued
                      rule_count:
                        type: integer
        '422':
          description: confirmation required
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - confirmation
                properties:
                  error:
                    type: string
                    enum:
                    - confirmation_required
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  confirmation:
                    type: object
                    required:
                    - rule_count
                    - affected_resource_count
                    - auto_categorize
                    properties:
                      rule_count:
                        type: integer
                      affected_resource_count:
                        type: integer
                        description: Unique transactions any rule matches
                      auto_categorize:
                        type: boolean
                      ai_model:
                        type: string
                        nullable: true
                      estimated_ai_cost:
                        type: number
                        nullable: true
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
  "/api/v1/rules/reorder":
    patch:
      summary: Reorder rules
      tags:
      - Rules
      description: Sets the run order of all the family's rules, top to bottom, as
        the web drag and drop does. rule_ids lists every rule of the family exactly
        once, and the rules of a group next to each other (a group moves as one block).
        A group with no rules stays after the item it follows now.
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: rules reordered
          content:
            application/json:
              schema:
                type: object
                required:
                - rules
                properties:
                  rules:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Rule"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: rule_ids are not exactly the family's rules, or split a group
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - rule_ids
              properties:
                rule_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
