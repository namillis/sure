        description: Filter transfers until this date
      responses:
        '200':
          description: transfers listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransferDecisionCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/transfers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Transfer ID
      schema:
        type: string
    get:
      summary: Retrieve a transfer
      tags:
      - Transfers
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: transfer retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransferDecision"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: transfer not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/users/reset":
    delete:
      summary: Reset account
      tags:
      - Users
      description: Resets all financial data (accounts, categories, merchants, tags,
        etc.) for the current user's family while keeping the user account intact.
        The reset runs asynchronously in the background. The returned job_id is informational
        only; reset status is family-scoped, not job-scoped. Requires admin role.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account reset initiated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResetInitiatedResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: forbidden - requires read_write scope and admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '500':
          description: reset enqueue failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/users/reset/status":
    get:
      summary: Retrieve reset status
      tags:
      - Users
      description: Returns counts of family-owned data targeted by account reset.
        Use this after DELETE /api/v1/users/reset to decide whether reset materialization
        has completed. Completion is a counts-based family snapshot and may change
        if new data is created after reset.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: reset status returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResetStatusResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: forbidden - requires admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/valuations":
    get:
      summary: List valuations
      tags:
      - Valuations
      security:
      - apiKeyAuth: []
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Items per page (default: 25, max: 100)'
        schema:
          type: integer
      - name: account_id
        in: query
        required: false
        description: Filter by account ID
        schema:
          type: string
          format: uuid
      - name: start_date
        in: query
        required: false
        description: Filter valuations from this date
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        description: Filter valuations until this date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: valuations listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValuationCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid account filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Create valuation
      tags:
      - Valuations
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: valuation created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Valuation"
        '200':
          description: existing valuation upserted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Valuation"
        '422':
          description: validation error - missing date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                valuation:
                  type: object
                  properties:
                    account_id:
                      type: string
                      format: uuid
                      description: Account ID (required)
                    amount:
                      type: number
                      description: Valuation amount (required)
                    date:
                      type: string
                      format: date
                      description: Valuation date (required)
                    notes:
                      type: string
                      description: Additional notes
                    upsert:
                      type: boolean
                      description: Nested alternative to the top-level response-status
                        flag. Top-level upsert takes precedence when both are provided.
                  required:
                  - account_id
                  - amount
                  - date
                upsert:
                  type: boolean
                  description: Response-status signal only. When true and a same-account
                    same-date valuation exists before the request, the endpoint returns
                    200 OK instead of 201 Created. The underlying reconciliation write
                    path is unchanged; this flag does not add duplicate-prevention
                    or safe-retry guarantees beyond existing same-date reconciliation
                    behavior.
              required:
              - valuation
        required: true
  "/api/v1/valuations/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Valuation ID (entry ID)
      schema:
        type: string
    get:
      summary: Retrieve a valuation
      tags:
      - Valuations
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: valuation retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Valuation"
        '404':
          description: valuation not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update a valuation
      tags:
      - Valuations
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: valuation updated with amount and date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Valuation"
        '422':
          description: validation error - only one of amount/date provided
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: valuation not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                valuation:
                  type: object
                  properties:
                    amount:
                      type: number
                      description: New valuation amount (must provide with date)
                    date:
                      type: string
                      format: date
                      description: New valuation date (must provide with amount)
                    notes:
                      type: string
                      description: Additional notes
        required: true
  "/api/v1/version":
    get:
      summary: Get the running Sure version
      tags:
      - Version
      description: Requires read or read_write access. Operators may explicitly enable
        anonymous access with PUBLIC_VERSION_ENDPOINT=true. Responses are not cacheable.
        Supplied credentials are still validated in public mode.
      security:
      - apiKeyAuth: []
      - oauth2:
        - read
      responses:
        '200':
          description: running version
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Version"
        '401':
          description: missing or invalid credentials (default configuration)
        '403':
          description: insufficient scope
  "/api/v1/web_handoffs":
    post:
      summary: Create a web handoff
      tags:
      - Web Handoffs
      description: 'Returns a one-time URL, valid for 60 seconds, that opens a provider
        connect or reconnect page in a web session for the API user, without another
        sign-in. The session can only reach the providers page and the provider connection
        pages, lasts at most 30 minutes, and ends by sending the browser to sureplus://connections/done?status=ok|cancelled|error.
        Needs read_write. Limited to 10 per user per minute. Allowed paths: /settings/providers,
        /settings/providers/{provider}/connect_form, and the GET new, edit, setup_accounts,
        select_accounts, select_existing_account, select_profiles, select_bank, new_wallet
        and connect pages of the *_items provider routes.'
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: handoff created
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - expires_at
                properties:
                  url:
                    type: string
                    description: Open once, in the app's auth sheet
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: read-only credential or guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: path not allowed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - web_handoff
              properties:
                web_handoff:
                  type: object
                  required:
                  - path
                  properties:
                    path:
                      type: string
                      example: "/plaid_items/new?region=us"
                      description: A relative path on this server
