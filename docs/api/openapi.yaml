---
openapi: 3.0.3
info:
  title: Sure API
  version: v1
  description: OpenAPI documentation generated from executable request specs.
servers:
- url: https://app.sure.am
  description: Production
- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-Api-Key
      in: header
      description: API key for authentication. Generate one from your account settings.
    financekitPublisher:
      type: http
      scheme: bearer
      bearerFormat: opaque publisher credential
      description: Revocable credential restricted to one FinanceKit publisher upload
        URL.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: "/oauth/authorize"
          tokenUrl: "/oauth/token"
          scopes:
            read: Read access
            read_write: Read and write access
  schemas:
    Version:
      type: object
      additionalProperties: false
      required:
      - version
      - commit_sha
      properties:
        version:
          type: string
          description: Running Sure version, without a v prefix.
        commit_sha:
          type: string
          nullable: true
          description: Build commit SHA, or null when unavailable.
        features:
          type: array
          items:
            type: string
          description: Sure+ API additions this server supports. Absent on a stock
            Sure server and on unauthenticated requests.
    ChartSeries:
      type: object
      required:
      - period
      - start_date
      - end_date
      - interval
      - currency
      - trend
      - values
      properties:
        period:
          type: string
          description: Period key, or "custom" when start_date/end_date were given.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        interval:
          type: string
          example: 1 day
          description: 1 day up to a year, 1 week up to 5 years, 1 month beyond.
        currency:
          type: string
          example: USD
        account_id:
          type: string
          format: uuid
          description: Account series only.
        view:
          type: string
          enum:
          - balance
          - cash_balance
          - holdings_balance
          description: Account series only.
        trend:
          type: object
          nullable: true
          description: Change from the first to the last point. Null when there are
            no points.
          properties:
            value:
              type: string
            value_cents:
              type: integer
            percent:
              type: number
              nullable: true
              description: Null when the first value is zero.
            percent_formatted:
              type: string
            direction:
              type: string
              enum:
              - up
              - down
              - flat
            favorable_direction:
              type: string
              enum:
              - up
              - down
        values:
          type: array
          description: Oldest first, one point per interval.
          items:
            type: object
            required:
            - date
            - value
            - value_cents
            properties:
              date:
                type: string
                format: date
              value:
                type: string
              value_cents:
                type: integer
    SplitRequest:
      type: object
      required:
      - split
      properties:
        split:
          type: object
          required:
          - splits
          properties:
            splits:
              type: array
              minItems: 1
              description: Child transactions. Amounts must sum exactly to the parent
                amount.
              items:
                type: object
                required:
                - amount
                properties:
                  name:
                    type: string
                    nullable: true
                    description: Defaults to the parent name when omitted
                  amount:
                    type: string
                    description: Same sign convention as the transaction amount
                  category_id:
                    type: string
                    nullable: true
                  merchant_id:
                    type: string
                    nullable: true
                    description: Omitted or null, the child takes the parent's merchant
                  tag_ids:
                    type: array
                    items:
                      type: string
                    nullable: true
                    description: No tags when omitted
                  excluded:
                    type: boolean
                    nullable: true
    Split:
      type: object
      required:
      - transaction_id
      - amount
      - amount_decimal
      - amount_cents
      - currency
      - children
      properties:
        transaction_id:
          type: string
        amount:
          type: string
          description: Formatted parent amount, rounded for display
        amount_decimal:
          type: string
          description: Exact stored amount; children must sum to this
        amount_cents:
          type: integer
          description: Absolute amount in minor units
        currency:
          type: string
        children:
          type: array
          items:
            "$ref": "#/components/schemas/SplitChild"
    SplitChild:
      allOf:
      - "$ref": "#/components/schemas/Transaction"
      - type: object
        required:
        - amount_decimal
        - excluded
        properties:
          amount_decimal:
            type: string
            description: Exact stored amount; send this back when replacing the split
          excluded:
            type: boolean
            description: Whether this child is excluded from totals
    Pagination:
      type: object
      required:
      - page
      - per_page
      - total_count
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    AccountStatementAccount:
      type: object
      required:
      - id
      - name
      - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
    AccountStatement:
      type: object
      required:
      - id
      - filename
      - content_type
      - byte_size
      - content_sha256
      - review_status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
          minimum: 1
        content_sha256:
          type: string
          description: SHA-256 of the file (lowercase hex); the vault stores each
            file once per family
        review_status:
          type: string
          enum:
          - unmatched
          - linked
          - rejected
        period_start_on:
          type: string
          format: date
          nullable: true
        period_end_on:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          nullable: true
        opening_balance:
          type: string
          nullable: true
        closing_balance:
          type: string
          nullable: true
        institution_name_hint:
          type: string
          nullable: true
        account_last4_hint:
          type: string
          nullable: true
        account:
          allOf:
          - "$ref": "#/components/schemas/AccountStatementAccount"
          nullable: true
          description: Account the statement is linked to
        suggested_account:
          allOf:
          - "$ref": "#/components/schemas/AccountStatementAccount"
          nullable: true
          description: Account the vault suggests for an unlinked statement; linking
            it is confirmed in the app
        match_confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountStatementResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          "$ref": "#/components/schemas/AccountStatement"
        meta:
          type: object
          required:
          - duplicate
          properties:
            duplicate:
              type: boolean
              description: True when the uploaded file was already in the vault; the
                existing statement is returned and nothing is created
    AccountStatementCollection:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 100
          items:
            "$ref": "#/components/schemas/AccountStatement"
        meta:
          "$ref": "#/components/schemas/Pagination"
    FamilyExportFile:
      type: object
      required:
      - attached
      properties:
        attached:
          type: boolean
        byte_size:
          type: integer
          nullable: true
          minimum: 0
        content_type:
          type: string
          nullable: true
    FamilyExport:
      type: object
      required:
      - id
      - status
      - filename
      - downloadable
      - file
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        filename:
          type: string
        downloadable:
          type: boolean
        download_path:
          type: string
          nullable: true
        file:
          "$ref": "#/components/schemas/FamilyExportFile"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FamilyExportResponse:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/FamilyExport"
    FamilyExportCollection:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 100
          items:
            "$ref": "#/components/schemas/FamilyExport"
        meta:
          "$ref": "#/components/schemas/Pagination"
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        message:
          type: string
          nullable: true
        details:
          oneOf:
          - type: array
            items:
              type: string
          - type: object
          nullable: true
        errors:
          type: array
          items:
            type: string
          nullable: true
          description: Validation error messages (alternative to details used by trades,
            valuations, etc.)
    ErrorResponseWithImportId:
      type: object
      required:
      - error
      - import_id
      properties:
        error:
          type: string
        message:
          type: string
          nullable: true
        import_id:
          type: string
          format: uuid
          description: Import ID preserved for retry or inspection after upload succeeds
            but publish fails
    MfaRequiredResponse:
      type: object
      required:
      - error
      - mfa_required
      properties:
        error:
          type: string
        mfa_required:
          type: boolean
    ToolCall:
      type: object
      required:
      - id
      - function_name
      - function_arguments
      - created_at
      properties:
        id:
          type: string
          format: uuid
        function_name:
          type: string
        function_arguments:
          type: object
          additionalProperties: true
        function_result:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required:
      - id
      - type
      - role
      - content
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - user_message
          - assistant_message
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        model:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tool_calls:
          type: array
          items:
            "$ref": "#/components/schemas/ToolCall"
          nullable: true
    MessageResponse:
      allOf:
      - "$ref": "#/components/schemas/Message"
      - type: object
        required:
        - chat_id
        properties:
          chat_id:
            type: string
            format: uuid
          ai_response_status:
            type: string
            enum:
            - pending
            - complete
            - failed
            nullable: true
          ai_response_message:
            type: string
            nullable: true
    ChatResource:
      type: object
      required:
      - id
      - title
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatSummary:
      allOf:
      - "$ref": "#/components/schemas/ChatResource"
      - type: object
        required:
        - message_count
        properties:
          message_count:
            type: integer
            minimum: 0
          last_message_at:
            type: string
            format: date-time
            nullable: true
    ChatDetail:
      allOf:
      - "$ref": "#/components/schemas/ChatResource"
      - type: object
        required:
        - messages
        properties:
          messages:
            type: array
            items:
              "$ref": "#/components/schemas/Message"
          pagination:
            "$ref": "#/components/schemas/Pagination"
            nullable: true
    ChatCollection:
      type: object
      required:
      - chats
      - pagination
      properties:
        chats:
          type: array
          items:
            "$ref": "#/components/schemas/ChatSummary"
        pagination:
          "$ref": "#/components/schemas/Pagination"
    Insight:
      type: object
      required:
      - id
      - type
      - title
      - body
      - priority
      - status
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        priority:
          type: string
          enum:
          - high
          - medium
          - low
        status:
          type: string
          enum:
          - active
          - read
        generated_at:
          type: string
          format: date-time
          nullable: true
    InsightCollection:
      type: object
      required:
      - insights
      properties:
        insights:
          type: array
          items:
            "$ref": "#/components/schemas/Insight"
    PushSubscriptionRegistration:
      type: object
      required:
      - token
      - environment
      - platform
      properties:
        token:
          type: string
          maxLength: 2048
          pattern: "^(?:[0-9a-fA-F]{2})+$"
        environment:
          type: string
          enum:
          - sandbox
          - production
        platform:
          type: string
          enum:
          - ios
        device_key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Optional 256-bit installation secret, unique per server and
            kept in device secure storage. Required proof to replace another user’s
            registration for this device. Never returned.
    PushSubscription:
      type: object
      required:
      - id
      - environment
      - platform
      - last_registered_at
      properties:
        id:
          type: string
          format: uuid
        environment:
          type: string
          enum:
          - sandbox
          - production
        platform:
          type: string
          enum:
          - ios
        last_registered_at:
          type: string
          format: date-time
    RetryResponse:
      type: object
      required:
      - message
      - message_id
      properties:
        message:
          type: string
        message_id:
          type: string
          format: uuid
    Account:
      type: object
      required:
      - id
      - name
      - account_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_type:
          type: string
          nullable: true
        status:
          type: string
    AccountDetail:
      type: object
      required:
      - id
      - name
      - balance
      - balance_cents
      - cash_balance
      - cash_balance_cents
      - currency
      - classification
      - account_type
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        balance:
          type: string
        balance_cents:
          type: integer
          description: Signed balance in minor currency units
        cash_balance:
          type: string
        cash_balance_cents:
          type: integer
          description: Signed cash balance in minor currency units
        currency:
          type: string
        classification:
          type: string
        account_type:
          type: string
          nullable: true
        subtype:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - draft
          - disabled
          - pending_deletion
        institution_name:
          type: string
          nullable: true
        institution_domain:
          type: string
          nullable: true
        linked:
          type: boolean
          description: Synced from a provider (Sure+ `accounts.permissions`)
        permissions:
          type: object
          description: What the API user may do through PATCH/DELETE /api/v1/accounts/{id}
          properties:
            edit:
              type: boolean
            delete:
              type: boolean
        locked_fields:
          type: array
          items:
            type: string
          description: Fields a PATCH may not send for this linked account; accountable
            fields are `accountable_attributes.<key>`
        accountable:
          type: object
          nullable: true
          description: 'Show and write responses only (Sure+ `accounts.loan_rates`).
            The type''s own fields, keyed as PATCH takes them in `accountable_attributes`.
            Loan: subtype, rate_type, interest_rate, term_months, initial_balance,
            start_date, down_payment, insurance_rate, insurance_rate_type, day_count_convention,
            principal_only_transfers, rate_changes [{effective_date, rate}]. CreditCard:
            available_credit, minimum_payment, apr, annual_fee, expiration_date, statement_close_day,
            due_day. Investment: subtype. Crypto: subtype, tax_treatment. Vehicle:
            make, model, year, mileage_value, mileage_unit, initial_balance, initial_balance_shown,
            purchase_date. Property: subtype, year_built, area_unit, area_value, address_attributes.
            Other types: empty.'
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountCollection:
      type: object
      required:
      - accounts
      - pagination
      properties:
        accounts:
          type: array
          items:
            "$ref": "#/components/schemas/AccountDetail"
        pagination:
          "$ref": "#/components/schemas/Pagination"
    FamilySettings:
      type: object
      required:
      - id
      - currency
      - locale
      - date_format
      - month_start_day
      - moniker
      - default_account_sharing
      - custom_enabled_currencies
      - enabled_currencies
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        currency:
          type: string
        locale:
          type: string
        date_format:
          type: string
        country:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        month_start_day:
          type: integer
          minimum: 1
          maximum: 28
        moniker:
          type: string
          enum:
          - Family
          - Group
        default_account_sharing:
          type: string
          enum:
          - shared
          - private
        custom_enabled_currencies:
          type: boolean
        enabled_currencies:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BudgetSummary:
      type: object
      required:
      - id
      - start_date
      - end_date
      - name
      - currency
      - initialized
      - current
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        name:
          type: string
        currency:
          type: string
        initialized:
          type: boolean
        current:
          type: boolean
        can_edit:
          type: boolean
          description: Whether the caller can change this budget; false for a budget
            shared read-only
        budgeted_spending:
          type: string
          nullable: true
        budgeted_spending_cents:
          type: integer
          nullable: true
        expected_income:
          type: string
          nullable: true
        expected_income_cents:
          type: integer
          nullable: true
        allocated_spending:
          type: string
        allocated_spending_cents:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Budget:
      type: object
      required:
      - id
      - start_date
      - end_date
      - name
      - currency
      - initialized
      - current
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        name:
          type: string
        currency:
          type: string
        initialized:
          type: boolean
        current:
          type: boolean
        can_edit:
          type: boolean
          description: Whether the caller can change this budget; false for a budget
            shared read-only
        budgeted_spending:
          type: string
          nullable: true
        budgeted_spending_cents:
          type: integer
          nullable: true
        expected_income:
          type: string
          nullable: true
        expected_income_cents:
          type: integer
          nullable: true
        allocated_spending:
          type: string
        allocated_spending_cents:
          type: integer
        actual_spending:
          type: string
        actual_spending_cents:
          type: integer
        actual_income:
          type: string
        actual_income_cents:
          type: integer
        available_to_spend:
          type: string
        available_to_spend_cents:
          type: integer
        available_to_allocate:
          type: string
        available_to_allocate_cents:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BudgetCollection:
      type: object
      required:
      - budgets
      - pagination
      properties:
        budgets:
          type: array
          items:
            "$ref": "#/components/schemas/BudgetSummary"
        pagination:
          "$ref": "#/components/schemas/Pagination"
    BudgetCategorySummary:
      type: object
      required:
      - id
      - budget_id
      - currency
      - subcategory
      - inherits_parent_budget
      - rollover_enabled
      - category
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        budget_id:
          type: string
          format: uuid
        currency:
          type: string
        subcategory:
          type: boolean
        inherits_parent_budget:
          type: boolean
        rollover_enabled:
          type: boolean
        budgeted_spending:
          type: string
        budgeted_spending_cents:
          type: integer
        display_budgeted_spending:
          type: string
        display_budgeted_spending_cents:
          type: integer
        category:
          type: object
          required:
          - id
          - name
          - color
          - lucide_icon
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            color:
              type: string
            lucide_icon:
              type: string
            parent_id:
              type: string
              format: uuid
              nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BudgetCategory:
      type: object
      required:
      - id
      - budget_id
      - currency
      - subcategory
      - inherits_parent_budget
      - rollover_enabled
      - category
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        budget_id:
          type: string
          format: uuid
        currency:
          type: string
        subcategory:
          type: boolean
        inherits_parent_budget:
          type: boolean
        rollover_enabled:
          type: boolean
        budgeted_spending:
          type: string
        budgeted_spending_cents:
          type: integer
        display_budgeted_spending:
          type: string
        display_budgeted_spending_cents:
          type: integer
        actual_spending:
          type: string
        actual_spending_cents:
          type: integer
        rolled_over_amount:
          type: string
        rolled_over_amount_cents:
          type: integer
        available_to_spend:
          type: string
        available_to_spend_cents:
          type: integer
        average_spent:
          type: string
          description: Mean monthly spending across every month with spending in this
            category
        average_spent_cents:
          type: integer
        median_spent:
          type: string
          description: Median monthly spending; the figure the web shows as "/m avg"
        median_spent_cents:
          type: integer
        category:
          type: object
          required:
          - id
          - name
          - color
          - lucide_icon
          properties:
            id:
              type: string
              format: uuid
