      description: Budget ID
      schema:
        type: string
        format: uuid
    post:
      summary: Move allocation between budget categories
      tags:
      - Budget Categories
      security:
      - apiKeyAuth: []
      description: 'Moves part of one category''s allocation to another in the same
        budget, as the web''s move does. Returns both updated rows and the budget.
        422 carries a `reason`: non_positive_amount, insufficient_funds, different_budgets,
        same_category, parent_child or uncategorized.'
      parameters: []
      responses:
        '200':
          description: allocation moved
          content:
            application/json:
              schema:
                type: object
                required:
                - from
                - to
                - budget
                properties:
                  from:
                    "$ref": "#/components/schemas/BudgetCategory"
                  to:
                    "$ref": "#/components/schemas/BudgetCategory"
                  budget:
                    "$ref": "#/components/schemas/Budget"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: forbidden - requires read_write scope, or the budget is shared
            read-only
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: budget or budget category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid move
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                - reason
                properties:
                  error:
                    type: string
                    example: validation_failed
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  reason:
                    type: string
                    example: insufficient_funds
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - move
              properties:
                move:
                  type: object
                  required:
                  - from_id
                  - to_id
                  - amount
                  properties:
                    from_id:
                      type: string
                      format: uuid
                      description: Budget category to take from
                    to_id:
                      type: string
                      format: uuid
                      description: Budget category to give to
                    amount:
                      type: number
                      exclusiveMinimum: 0
                      example: 50
        required: true
